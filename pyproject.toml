[project]
name = "maidan"
version = "1.0.0"
description = "A local LLM playground — pick a model, tune the sampler, watch tokens arrive."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]  # B008: Depends() in defaults is the FastAPI idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.black]
line-length = 100
target-version = ["py311"]
