services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: maidan
      POSTGRES_PASSWORD: maidan
      POSTGRES_DB: maidan
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maidan -d maidan"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set — generate one with python -c "import secrets; print(secrets.token_urlsafe(48))"}
      DATABASE_URL: postgresql+psycopg2://maidan:maidan@db:5432/maidan
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_PER_MINUTE: "60"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
